name: Board engine tests
on:
  push:
    paths: ["web/**", ".github/workflows/web-tests.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-tests.yml"]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: web
